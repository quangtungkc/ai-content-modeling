services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-content-modeling-postgres
    environment:
      POSTGRES_DB: ai_content_modeling
      POSTGRES_USER: ai_content_modeling
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5433:5432"
    volumes:
      - ai-content-modeling-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_content_modeling -d ai_content_modeling"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: ai-content-modeling-redis
    ports:
      - "6379:6379"
    volumes:
      - ai-content-modeling-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ai-content-modeling-postgres:
  ai-content-modeling-redis:
